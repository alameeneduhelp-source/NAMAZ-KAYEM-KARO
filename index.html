<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050c2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Khasmallick Markaz">
<title>KHASMALLICK MARKAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#050c2e; --blue2:#0f2065; --blue3:#16308c; --gold:#f6d876; --gold2:#d4ab2e; --goldlite:#ffe9a8;
  --green:#3fd684; --green2:#0f5c34; --pink:#ef8ac0; --teal:#5be3d8;
  --bg:#040a24; --card:#0d1746; --text:#ffffff; --muted:#c7d0f0; --line:#caa227;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;
  font-size:17px;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;min-height:100%;background:radial-gradient(circle at 20% 0%,#122a72 0%,var(--blue) 45%,#020617 100%);color:var(--text);font-family:'Poppins','Noto Sans Bengali',sans-serif;font-size:1rem;line-height:1.5;}
.glitter{background-image:radial-gradient(circle,rgba(243,207,94,.95) 1px,transparent 1.6px),radial-gradient(circle,rgba(58,214,201,.7) 1px,transparent 1.6px),radial-gradient(circle,rgba(243,207,94,.6) 1px,transparent 1.6px);
  background-size:60px 60px,80px 80px,45px 45px;background-position:0 0,20px 30px,40px 10px;animation:tw 6s linear infinite;}
@keyframes tw{0%{background-position:0 0,20px 30px,40px 10px;}100%{background-position:60px 60px,100px 110px,85px 55px;}}
.topbar{position:sticky;top:0;z-index:5;}
nav{display:flex;align-items:center;gap:14px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--blue);border-bottom:2px solid var(--gold2);}
.navbrand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.navlogo{width:42px;height:42px;min-width:42px;border-radius:10px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:800;color:#241a00;font-size:1.15rem;overflow:hidden;}
.navlogo img{width:100%;height:100%;object-fit:cover;}
#brandDome{font-size:1.4rem;}
.navtext{min-width:0;}
.navtext .nm{color:#fff;font-weight:800;font-size:1.02rem;font-family:'Noto Sans Bengali',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.navtext .tg{color:var(--gold);font-size:.72rem;font-weight:600;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
nav .navbtns{display:flex;gap:8px;}
nav .navbtns button{border:1.5px solid var(--gold2);background:transparent;color:var(--goldlite);padding:9px 14px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;white-space:nowrap;}
nav .navbtns button.active{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a00;border-color:var(--gold);}
.hero{background:
    radial-gradient(circle at 15% 20%, rgba(243,207,94,.12) 0, transparent 55%),
    radial-gradient(circle at 85% 15%, rgba(58,214,201,.12) 0, transparent 55%),
    linear-gradient(160deg,var(--blue),var(--blue3) 60%,var(--blue));
  color:#fff;text-align:center;padding:44px 20px 40px;border-radius:18px;margin-bottom:18px;position:relative;overflow:hidden;border:1.5px solid var(--gold2);}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.10) 1px,transparent 1.4px);background-size:26px 26px;opacity:.4;pointer-events:none;}
.hero-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;border:1.5px solid rgba(255,255,255,.35);border-radius:20px;padding:7px 18px;font-size:.85rem;font-weight:700;color:var(--gold);margin-bottom:22px;background:rgba(255,255,255,.05);}
.hero h1{position:relative;z-index:1;margin:0 0 14px;font-size:1.85rem;line-height:1.3;font-weight:800;font-family:'Noto Sans Bengali',sans-serif;color:#fff;}
.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{position:relative;z-index:1;color:#c7d0f0;font-size:1rem;max-width:480px;margin:0 auto 26px;line-height:1.6;}
.hero .cta-row{position:relative;z-index:1;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.hero .cta-row button{padding:14px 24px;border-radius:10px;font-weight:700;font-size:1.02rem;cursor:pointer;}
.hero .cta-primary{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a00;border:none;}
.hero .cta-secondary{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.5);}
main{max-width:680px;margin:0 auto;padding:16px;padding-bottom:40px;}
.card{background:linear-gradient(160deg,var(--card),#0a1230);border:1.5px solid var(--gold2);box-shadow:0 0 14px rgba(243,207,94,.08);border-radius:14px;padding:18px;margin-bottom:16px;}
.card h2{margin:0 0 12px;font-size:1.25rem;color:var(--gold);}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;}
.pcell{border:1.5px solid var(--gold2);background:linear-gradient(160deg,rgba(58,214,201,.1),rgba(224,111,174,.07));border-radius:10px;padding:12px;text-align:center;}
.pcell b{display:block;font-family:'Noto Sans Bengali',sans-serif;font-size:1.15rem;margin-bottom:6px;color:var(--teal);}
.pcell small{color:var(--muted);display:block;font-size:.95rem;margin-top:2px;}
.pcell .jamaat{color:var(--gold);font-weight:700;}
.next{background:linear-gradient(135deg,var(--blue3),var(--blue));color:#fff;text-align:center;padding:22px;border-radius:14px;margin-bottom:16px;position:relative;overflow:hidden;border:2px solid var(--gold);}
.next .name{font-family:'Noto Sans Bengali',sans-serif;font-size:1.6rem;font-weight:700;color:var(--gold);position:relative;z-index:1;}
.next .time{font-size:1.9rem;font-weight:700;color:#fff;position:relative;z-index:1;}
.next .cd{font-size:1.35rem;letter-spacing:1px;margin-top:6px;color:var(--green);position:relative;z-index:1;font-weight:700;}
.row2{display:flex;gap:10px;}
.row2 .pcell{flex:1;}
label{display:block;font-size:1rem;color:var(--teal);margin:10px 0 5px;font-weight:600;}
input,select,textarea{width:100%;padding:13px;border-radius:8px;border:2px solid var(--gold2);background:linear-gradient(135deg,#132a6e,#0a1230);color:var(--goldlite);font-size:1.08rem;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 8px rgba(58,214,201,.5);}
input[type=checkbox]{width:auto;accent-color:var(--gold);transform:scale(1.2);}
button.btn{background:linear-gradient(135deg,var(--blue3),var(--blue));color:var(--gold);border:1.5px solid var(--gold2);padding:13px 18px;border-radius:8px;font-weight:700;cursor:pointer;margin-top:12px;font-size:1.05rem;}
button.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a00;border:none;}
button.btn.green{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border:none;}
button.btn.ghost{background:transparent;color:var(--gold);border:1.5px solid var(--gold);}
.warn{background:#4a3900;color:#ffe08a;border:1px solid var(--gold2);padding:10px 12px;border-radius:8px;font-size:.98rem;margin-top:8px;font-weight:600;}
.hidden{display:none !important;}
table{width:100%;border-collapse:collapse;font-size:.98rem;}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--gold2);color:var(--text);}
.pref-list label{display:flex;align-items:center;gap:8px;font-size:1rem;color:var(--text);margin:6px 0;font-weight:400;}
.pref-list input{width:auto;}
.footer{text-align:center;font-size:.92rem;color:var(--muted);margin-top:22px;line-height:1.6;}
.poster-wrap{text-align:center;}
canvas{max-width:100%;border-radius:10px;border:2px solid var(--gold2);}
.tabbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.tabbar button{flex:1;min-width:110px;padding:11px;border-radius:8px;border:1.5px solid var(--gold2);background:var(--blue);color:var(--goldlite);font-size:.98rem;cursor:pointer;font-weight:700;}
.tabbar button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#241a00;border-color:var(--gold);}
.userrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--gold2);font-size:1.02rem;}
.wabtn{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;border:none;padding:9px 15px;border-radius:6px;font-size:.98rem;cursor:pointer;text-decoration:none;font-weight:700;}
.chip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:12px;}
.chip{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:10px;font-size:.98rem;font-weight:700;color:#fff;cursor:pointer;border:1.5px solid rgba(255,255,255,.35);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.chip input{width:auto;accent-color:#fff;transform:scale(1.15);}
#alarmBanner{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;z-index:60;background:linear-gradient(160deg,#16308c,#050c2e);border:2px solid var(--gold);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.6);text-align:center;}
#alarmBannerMsg{font-size:1.15rem;font-weight:800;color:var(--gold);font-family:'Noto Sans Bengali',sans-serif;}
#alarmBannerStatus{font-size:.9rem;color:#ffd9a0;margin-top:6px;min-height:1.2em;}
#alarmBanner .abbtns{display:flex;gap:10px;margin-top:10px;}
#alarmBanner button{flex:1;padding:12px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;border:none;}
#alarmBannerPlay{background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;}
#alarmBannerStop{background:linear-gradient(135deg,#7a1717,#c94444);color:#fff;}
.note{font-size:.92rem;color:#8ff0e6;margin-top:8px;line-height:1.5;}
</style>
</head>
<body>
<div id="alarmBanner" class="hidden">
  <div id="alarmBannerMsg"></div>
  <div id="alarmBannerStatus"></div>
  <div class="abbtns">
    <button type="button" id="alarmBannerPlay">🔊 আজান শুনুন</button>
    <button type="button" id="alarmBannerStop">⏹ বন্ধ করুন</button>
  </div>
</div>
<div class="topbar">
<nav>
  <div class="navbrand">
    <div class="navlogo">
      <img id="brandLogo" src="" style="display:none;">
      <span id="brandDome">🕌</span>
    </div>
    <div class="navtext">
      <div class="nm" id="brandName">খাসমাল্লিক মারকাজ</div>
      <div class="tg" id="brandNameEn">KHASMALLICK MARKAZ</div>
    </div>
  </div>
  <div id="userChip" style="color:var(--teal);font-size:.72rem;font-weight:700;margin-right:4px;white-space:nowrap;"></div>
  <div class="navbtns">
    <button id="tabHome" class="active">হোম</button>
    <button id="tabAdmin">এডমিন</button>
  </div>
</nav>
</div>
<main>
  <section id="homeView"></section>
  <section id="adminView" class="hidden"></section>
</main>

const HADITH_POOL_VERSION = 2;
function migrateHadithPool(parsed){
  if(parsed.hadithPoolVersion===HADITH_POOL_VERSION && parsed.hadithPool && parsed.hadithPool.length) return false;
  const builtins = defaultHadithPool();
  const builtinTexts = new Set(builtins.map(h=>h.text));
  const existingCustom = (parsed.hadithPool||[]).filter(h=>h && h.text && !builtinTexts.has(h.text));
  parsed.hadithPool = builtins.concat(existingCustom);
  parsed.hadithPoolVersion = HADITH_POOL_VERSION;
  return true;
}
function load(){
  let d = localStorage.getItem(KEY);
  if(d){
    const parsed=JSON.parse(d);
    if(!parsed.notifSettings) parsed.notifSettings=defaultNotifSettings();
    if(!parsed.branding) parsed.branding=defaultBranding();
    const migrated = migrateHadithPool(parsed);
    if(migrated){ try{ save(parsed); }catch(e){} }
    return parsed;
  }
  const today = todayStr();

    branding: defaultBranding(),
    eid:{fitr:{date:'',time:'',venue:''},adha:{date:'',time:'',venue:''}} };
  data.schedules[today] = defaultDay();
  save(data);
  return data;
}

function daysSinceEpoch(dateStr){ return Math.floor(new Date(dateStr+'T00:00:00Z').getTime()/86400000); }
function getTodayHadithPair(dateStr){
  const pool = (DB.hadithPool && DB.hadithPool.length) ? DB.hadithPool : defaultHadithPool();
  if(pool.length===1) return [pool[0], pool[0]];
  const totalPairs = Math.ceil(pool.length/2);
  const pairIdx = ((daysSinceEpoch(dateStr) % totalPairs) + totalPairs) % totalPairs;
  const a = pool[(pairIdx*2) % pool.length];
  const b = pool[(pairIdx*2+1) % pool.length];
  return [a,b];
}

function timeToMinutes(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }
const BN_DIGITS='০১২৩৪৫৬৭৮৯';
function toBn(n){ return String(n).replace(/[0-9]/g, d=>BN_DIGITS[d]); }
function periodWord(h){
  if(h>=4 && h<6) return 'ভোর';
  if(h>=6 && h<12) return 'সকাল';
  if(h>=12 && h<16) return 'দুপুর';
  if(h>=16 && h<18) return 'বিকাল';
  if(h>=18 && h<19) return 'সন্ধ্যা';
  return 'রাত';
}
function fmt12(t){
  if(!t) return '--';
  let [h,m]=t.split(':').map(Number);
  const period = periodWord(h);
  const ap = h>=12?'PM':'AM';
  let h12=h%12; if(h12===0) h12=12;
  return period+' '+toBn(h12)+':'+toBn(String(m).padStart(2,'0'))+' ('+ap+')';
}

// ---------- AUDIO ALARM ----------
let audioCtx=null;
let alarmAudioEl=null;
let alarmCurrentSrc=null;
let azanBuffer=null, azanBufferSrc=null, azanDecodePromise=null, azanDecodeSrc=null, azanNode=null;
function getCtx(){
  if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; audioCtx=new C(); }
  return audioCtx;
}
function currentAlarmSrc(){ return DB.alarmSound || DEFAULT_AZAN_SOUND; }
function dataUrlToArrayBuffer(u){
  const bin=atob(u.slice(u.indexOf(',')+1));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return bytes.buffer;
}
function ensureAzanBuffer(){
  const src=currentAlarmSrc();
  if(azanBuffer && azanBufferSrc===src) return Promise.resolve(azanBuffer);
  if(azanDecodePromise && azanDecodeSrc===src) return azanDecodePromise;
  const ctx=getCtx();
  if(!ctx) return Promise.reject(new Error('no audio context'));
  azanDecodeSrc=src;
  azanDecodePromise=new Promise((resolve,reject)=>{
    let ab; try{ ab=dataUrlToArrayBuffer(src); }catch(e){ reject(e); return; }
    const ok=buf=>{ azanBuffer=buf; azanBufferSrc=src; resolve(buf); };
    try{ const r=ctx.decodeAudioData(ab, ok, reject); if(r && r.then) r.then(ok, reject); }catch(e){ reject(e); }
  });
  azanDecodePromise.catch(()=>{ if(azanDecodeSrc===src) azanDecodePromise=null; });
  return azanDecodePromise;
}
function getAlarmEl(){
  if(!alarmAudioEl){ alarmAudioEl=new Audio(); alarmAudioEl.preload='auto'; }
  const src=currentAlarmSrc();
  if(src && alarmCurrentSrc!==src){ alarmAudioEl.src=src; try{ alarmAudioEl.load(); }catch(e){} alarmCurrentSrc=src; }
  return alarmAudioEl;
}
function preloadAlarm(){ try{ ensureAzanBuffer().catch(()=>{}); }catch(e){} try{ getAlarmEl(); }catch(e){} }
function unlockAudio(){
  try{
    const ctx=getCtx();
    if(ctx){
      if(ctx.state==='suspended') ctx.resume();
      const b=ctx.createBuffer(1,1,22050); const src=ctx.createBufferSource(); src.buffer=b; src.connect(ctx.destination); src.start(0);
    }
  }catch(e){}
  try{ ensureAzanBuffer().catch(()=>{}); }catch(e){}
  try{
    const el=getAlarmEl(); el.muted=true;
    const done=()=>{ try{ el.pause(); el.currentTime=0; }catch(e){} el.muted=false; };
    const p=el.play();
    if(p && p.then) p.then(done).catch(()=>{ el.muted=false; }); else done();
  }catch(e){}
}
function playBeep(dur=0.6, vol=0.35){
  try{
    const ctx=getCtx(); if(!ctx) return;
    if(ctx.state==='suspended') ctx.resume();
    const t0=ctx.currentTime;
    for(let i=0;i<3;i++){
      const osc=ctx.createOscillator(); const gain=ctx.createGain();
      osc.type='sine'; osc.frequency.value = i%2===0?880:660;
      gain.gain.setValueAtTime(0, t0+i*0.35);
      gain.gain.linearRampToValueAtTime(vol, t0+i*0.35+0.05);
      gain.gain.linearRampToValueAtTime(0, t0+i*0.35+dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0+i*0.35); osc.stop(t0+i*0.35+dur+0.05);
    }
  }catch(e){}
}
function stopSoundOnly(){
  try{ if(azanNode){ azanNode.onended=null; azanNode.stop(0); azanNode.disconnect(); } }catch(e){}
  azanNode=null;
  try{ if(alarmAudioEl){ alarmAudioEl.pause(); alarmAudioEl.currentTime=0; } }catch(e){}
}
function stopAlarmSound(){ stopSoundOnly(); hideAlarmBanner(); }
// returns Promise<'webaudio'|'audio'|'beep'|'blocked'>
function playAlarmSound(){
  stopSoundOnly();
  const ctx=getCtx();
  const viaElement=()=>{
    const el=getAlarmEl(); el.pause(); el.currentTime=0; el.muted=false; el.volume=1;
    const p=el.play();
    return (p && p.then) ? p.then(()=>'audio') : Promise.resolve('audio');
  };
  const last=()=>{
    if(ctx && ctx.state!=='running') return 'blocked';
    playBeep(); return 'beep';
  };
  if(!ctx) return viaElement().catch(last);
  const resumeP = ctx.state==='suspended' ? ctx.resume().catch(()=>{}) : Promise.resolve();
  return resumeP.then(()=>ensureAzanBuffer()).then(buf=>{
    if(ctx.state!=='running') throw new Error('suspended');
    const node=ctx.createBufferSource(); node.buffer=buf; node.connect(ctx.destination);
    node.onended=()=>{ if(azanNode===node) azanNode=null; };
    node.start(0); azanNode=node;
    return 'webaudio';
  }).catch(()=>viaElement().catch(last));
}
function showAlarmBanner(msg){
  const b=document.getElementById('alarmBanner'); if(!b) return;
  document.getElementById('alarmBannerMsg').textContent='🔔 '+msg;
  document.getElementById('alarmBannerStatus').textContent='';
  b.classList.remove('hidden');
}

function setBannerStatus(m){
  const el=document.getElementById('alarmBannerStatus'); if(!el) return;
  el.textContent = m==='beep' ? '⚠ আজানের অডিও ফাইল চালানো যায়নি — বিপ শব্দ বাজানো হয়েছে।'

}
function fireAlert(msg){

function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawPoster(dateStr, day, hadithA, hadithB){
  const c = document.getElementById('posterCanvas'); if(!c) return;
  const ctx = c.getContext('2d');
  const W=c.width;
  const g = ctx.createLinearGradient(0,0,0,c.height);
  g.addColorStop(0,'#050c2e'); g.addColorStop(0.5,'#0f2065'); g.addColorStop(1,'#050c2e');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,c.height);
  ctx.save(); ctx.globalAlpha=0.5;
  for(let i=0;i<110;i++){ ctx.fillStyle = i%2===0?'#f3cf5e':'#3ad6c9'; const x=Math.random()*W, y=Math.random()*c.height, r=Math.random()*1.6+0.4;
    ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  ctx.restore();
  rr(ctx,10,10,W-20,c.height-20,18); ctx.strokeStyle='rgba(243,207,94,0.85)'; ctx.lineWidth=3; ctx.stroke();

  ctx.textAlign='center';
  ctx.fillStyle='#f3cf5e'; ctx.font='bold 26px Poppins'; ctx.fillText('KHASMALLICK MARKAZ', W/2, 52);
  ctx.fillStyle='#fff'; ctx.font='bold 22px "Noto Sans Bengali"'; ctx.fillText('আজকের নামাজের সময়সূচি', W/2, 84);
  ctx.font='16px "Noto Sans Bengali"'; ctx.fillStyle='#c8d0f0'; ctx.fillText(bnDateLabel(dateStr), W/2, 108);

  const palette=[{fill:'#123f91',acc:'#3ad6c9'},{fill:'#7a1750',acc:'#e06fae'},{fill:'#0f5c34',acc:'#2fbf6e'},{fill:'#5c3d00',acc:'#f3cf5e'},{fill:'#3a1c7a',acc:'#b98aff'}];
  let y=130; const boxH=76, boxGap=12, boxX=32, boxW=W-64;
  PRAYERS.forEach((p,i)=>{
    const pal=palette[i];
    const bg=ctx.createLinearGradient(boxX,y,boxX+boxW,y+boxH);
    bg.addColorStop(0,pal.fill); bg.addColorStop(1,'#0a1230');
    ctx.fillStyle=bg; rr(ctx,boxX,y,boxW,boxH,14); ctx.fill();
    ctx.strokeStyle=pal.acc; ctx.lineWidth=2.5; rr(ctx,boxX,y,boxW,boxH,14); ctx.stroke();
    ctx.fillStyle=pal.acc; rr(ctx,boxX,y,8,boxH,4); ctx.fill();
    ctx.textAlign='left'; ctx.font='bold 20px "Noto Sans Bengali"'; ctx.fillStyle='#fff';
    ctx.fillText(PNAME[p], boxX+24, y+32);
    ctx.font='14px "Noto Sans Bengali"'; ctx.fillStyle='#cfe8ff';
    ctx.fillText('আজান: '+fmt12(day.azan[p]), boxX+24, y+56);
    ctx.textAlign='right'; ctx.font='bold 16px "Noto Sans Bengali"'; ctx.fillStyle=pal.acc;
    ctx.fillText('নামাজ '+fmt12(day.jamaat[p]), boxX+boxW-16, y+44);
    y += boxH+boxGap;
  });

  y+=6;
  const halfW=(boxW-14)/2;
  [{label:'সেহরি',val:day.sehri,col:'#3ad6c9',fill:'#0f2a5c'},{label:'ইফতার',val:day.iftar,col:'#f3cf5e',fill:'#5c3d00'}].forEach((box,i)=>{
    const bx=boxX+i*(halfW+14);
    const bg=ctx.createLinearGradient(bx,y,bx,y+62);
    bg.addColorStop(0,box.fill); bg.addColorStop(1,'#0a1230');
    ctx.fillStyle=bg; rr(ctx,bx,y,halfW,62,14); ctx.fill();
    ctx.strokeStyle=box.col; ctx.lineWidth=2.5; rr(ctx,bx,y,halfW,62,14); ctx.stroke();
    ctx.textAlign='center'; ctx.font='bold 16px "Noto Sans Bengali"'; ctx.fillStyle='#fff';
    ctx.fillText(box.label, bx+halfW/2, y+26);
    ctx.font='bold 15px "Noto Sans Bengali"'; ctx.fillStyle=box.col;
    ctx.fillText(fmt12(box.val), bx+halfW/2, y+48);
  });
  y+=62+18;

  const hadithH=175;
  [hadithA, hadithB].forEach(h=>{
    const hbg=ctx.createLinearGradient(boxX,y,boxX,y+hadithH);
    hbg.addColorStop(0,'#3a1c7a'); hbg.addColorStop(1,'#0a1230');
    ctx.fillStyle=hbg; rr(ctx,boxX,y,boxW,hadithH,14); ctx.fill();
    ctx.strokeStyle='#b98aff'; ctx.lineWidth=2.5; rr(ctx,boxX,y,boxW,hadithH,14); ctx.stroke();
    ctx.textAlign='center'; ctx.font='bold 15px "Noto Sans Bengali"'; ctx.fillStyle='#f3cf5e';
    ctx.fillText('📖 আজকের হাদিস', W/2, y+28);
    ctx.font='italic 14px "Noto Sans Bengali"'; ctx.fillStyle='#f0e6c8';
    wrapText(ctx, '"'+h.text+'"', W/2, y+54, boxW-40, 20);
    ctx.font='12px "Noto Sans Bengali"'; ctx.fillStyle='#c9a5ff';
    ctx.fillText('— '+(h.ref||''), W/2, y+hadithH-14);
    y+=hadithH+16;
  });
  y+=6;

  ctx.font='12px Poppins'; ctx.fillStyle='#cfd4ee';
  ctx.fillText('Developed by Mahmudul Hasan Asif — AL-AMIN EDU HELP, Est. 2019', W/2, y);
  ctx.fillText('"For the Education, The Education for All"', W/2, y+18);
}
function wrapText(ctx,text,x,y,maxW,lh){
  const words=text.split(' '); let line=''; let cy=y;
  for(const w of words){ const test=line+w+' '; if(ctx.measureText(test).width>maxW && line){ ctx.fillText(line,x,cy); line=w+' '; cy+=lh; } else line=test; }
  ctx.fillText(line,x,cy);
  return cy;
}

function eidList(){

  if(DB.eid.fitr.date) list.push({key:'fitr', label:'ঈদুল ফিতর', date:DB.eid.fitr.date, time:DB.eid.fitr.time, venue:DB.eid.fitr.venue, note:DB.eid.fitr.note||''});

  return list.filter(e=>e.date>=todayStr()).sort((a,b)=>a.date<b.date?-1:1);
}

function wireMyAlarms(){
  document.querySelectorAll('[data-alarmon]').forEach(cb=>cb.onchange=()=>{
    const [p,type]=cb.dataset.alarmon.split('-');
    if(!DB.currentUser.alarmOverride) DB.currentUser.alarmOverride={};
    if(!DB.currentUser.alarmOverride[p]) DB.currentUser.alarmOverride[p]={};
    if(!DB.currentUser.alarmOverride[p][type]) DB.currentUser.alarmOverride[p][type]={};
    DB.currentUser.alarmOverride[p][type].on=cb.checked;
    save(DB); scheduleNotifications();
    const lbl=cb.parentElement; if(lbl) lbl.lastChild.textContent=' '+(cb.checked?'চালু':'বন্ধ');
  });
}
let firedAlarmKeys=new Set();
function minutesToHHMM(min){ min=((min%1440)+1440)%1440; const h=Math.floor(min/60), m=min%60; return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function alarmTimeFor(day,p,type){
  const c = day.alarm && day.alarm[type] && day.alarm[type][p];
  if(c) return c;
  return type==='azan' ? day.azan[p] : day.jamaat[p];
}
function alarmIsCustom(day,p,type){ return !!(day.alarm && day.alarm[type] && day.alarm[type][p]); }
function buildAlarmList(dateStr, day, user){
  const prefs=user.prefs||{}; const ov=user.alarmOverride||{};
  const ns=DB.notifSettings||defaultNotifSettings();
  const lead=Number(ns.leadMinutes)>0 ? Number(ns.leadMinutes) : 5;
  const list=[];
  PRAYERS.forEach(p=>{
    const pov=ov[p]||{};
    const aOn=!(pov.azan && pov.azan.on===false);
    const nOn=!(pov.namaz && pov.namaz.on===false);
    if(ns[p+'_azan']!==false && aOn){
      const t=alarmTimeFor(day,p,'azan');
      if(t) list.push({key:p+'_azan', time:t, msg:PNAME[p]+' এর আজানের সময় হয়েছে।', win:20});
    }
    if(ns[p+'_namaz']!==false && nOn){
      const t=alarmTimeFor(day,p,'namaz');
      if(t){
        list.push({key:p+'_namaz', time:t, msg:PNAME[p]+' এর নামাজ শুরু হয়েছে।', win:20});
        if(ns.jamaat5!==false && prefs.jamaat5!==false)
          list.push({key:p+'_namaz5', time:minutesToHHMM(timeToMinutes(t)-lead), msg:PNAME[p]+' এর নামাজ শুরু হতে '+toBn(lead)+' মিনিট বাকি।', win:10});
      }
    }
  });
  if(ns.sehri!==false && prefs.sehri!==false && day.sehri) list.push({key:'sehri', time:day.sehri, msg:'সেহরির সময় শেষ হতে চলেছে।', win:20});
  if(ns.iftar!==false && prefs.iftar!==false && day.iftar) list.push({key:'iftar', time:day.iftar, msg:'ইফতারের সময় হয়েছে।', win:20});
  if(ns.eid!==false && prefs.eid!==false){
    eidList().forEach(e=>{
      if(e.date===dateStr && e.time) list.push({key:'eid_'+e.key, time:e.time, msg:e.label+' এর নামাজ শুরু হয়েছে — সময়: '+fmt12(e.time)+(e.venue?', স্থান: '+e.venue:''), win:30});
    });
  }
  return list;
}
function currentAlarmUser(){ return DB.currentUser || {prefs:{}, alarmOverride:{}}; }
function tryFireAlarm(dateStr, a){
  const nowMin = nowIST().getHours()*60+nowIST().getMinutes();
  const diff = nowMin - timeToMinutes(a.time);
  if(diff<0 || diff>a.win) return;
  const fkey = dateStr+'|'+a.key+'|'+a.time;
  if(firedAlarmKeys.has(fkey)) return;
  firedAlarmKeys.add(fkey);
  fireAlert(diff>1 ? a.msg+' (একটু আগে, '+fmt12(a.time)+' এ ছিল)' : a.msg);
}
function checkAlarmsTick(){
  const dateStr=todayStr(); const day=getDay(dateStr);
  buildAlarmList(dateStr, day, currentAlarmUser()).forEach(a=>tryFireAlarm(dateStr,a));
}
function markPastAlarmsFired(){
  const dateStr=todayStr(); const day=getDay(dateStr);
  const nowMin = nowIST().getHours()*60+nowIST().getMinutes();
  buildAlarmList(dateStr, day, currentAlarmUser()).forEach(a=>{ if(timeToMinutes(a.time)<nowMin) firedAlarmKeys.add(dateStr+'|'+a.key+'|'+a.time); });
}
function nextAlarmText(){
  const dateStr=todayStr(); const day=getDay(dateStr);
  const nowMin = nowIST().getHours()*60+nowIST().getMinutes();
  const up=buildAlarmList(dateStr, day, currentAlarmUser()).filter(a=>timeToMinutes(a.time)>=nowMin).sort((x,y)=>timeToMinutes(x.time)-timeToMinutes(y.time))[0];
  return up ? '⏰ পরবর্তী অ্যালার্ম: '+up.msg+' — '+fmt12(up.time) : '✅ আজকের আর কোনো অ্যালার্ম বাকি নেই (কালকের সময়সূচি অনুযায়ী আবার বাজবে)।';
}
let alarmCheckIntervalId=null;
function scheduleNotifications(){
  checkAlarmsTick();
  if(!alarmCheckIntervalId) alarmCheckIntervalId=setInterval(checkAlarmsTick, 15000);
}

setInterval(()=>{
  const el=document.getElementById('countdown'); if(!el) return;
  const dateStr=todayStr(); const day=getDay(dateStr); const ist=nowIST();
  const nowMin=ist.getHours()*3600+ist.getMinutes()*60+ist.getSeconds();
  let target=null;
  for(const p of PRAYERS){ const t=timeToMinutes(day.jamaat[p])*60; if(t>=nowMin){target=t;break;} }
  if(target===null) target = timeToMinutes(day.jamaat.fajr)*60+86400;
  let diff=target-nowMin; const h=Math.floor(diff/3600); diff%=3600; const m=Math.floor(diff/60); const s=diff%60;
  el.textContent = String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
},1000);

  setTimeout(async ()=>{
    try{
      const htmlContent = '<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], {type:'text/html'});
      const filename='khasmallick-markaz-app.html';
      let done=false;
      try{
        if(window.claude && window.claude.use){
          const downloads = await window.claude.use('downloads');
          if(downloads){ await downloads.save({filename, data: blob}); done=true; }
        }
      }catch(e){ if(e && e.code==='declined'){ done=true; } }
      if(!done){
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.download=filename; a.href=url; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000);
      }
    }catch(e){ alert('ডাউনলোড করা গেল না, আবার চেষ্টা করুন।'); }
    btn.textContent = restoreLabel || orig; btn.disabled=false;
  }, 50);
}

  if(c==='auth/network-request-failed') return 'ইন্টারনেট সংযোগ নেই।';

async function startSession(user){
  stopAll();
  const setup=await getSetup(); CLOUD.setup=!!setup;
  try{
    if(user && setup && setup.adminUid===user.uid){
      CLOUD.role='admin'; CLOUD.phone=null; adminLoggedIn=true; DB.currentUser=null; listenApp(); listenUsers();
    }else if(user){

      const phone=map.data().phone, ref=fDb.doc('users/'+phone), u=(await ref.get()).data();
      if(u.active===false) throw {msg:'আপনার অ্যাকাউন্ট নিষ্ক্রিয়। এডমিনের সাথে যোগাযোগ করুন।'};
      if(u.deviceId && u.deviceId!==deviceId()) throw {msg:'এই নম্বর ইতিমধ্যে অন্য ডিভাইসে লগইন আছে। (এক ডিভাইস, এক লগইন) — এডমিনকে বলুন ডিভাইস রিসেট করতে।'};
      if(u.deviceId!==deviceId()) await ref.update({deviceId:deviceId(),lastLogin:Date.now()});
      CLOUD.role='user'; CLOUD.phone=phone; adminLoggedIn=false;
      DB.currentUser={wa:phone,name:u.name||'',prefs:u.prefs||{},alarmOverride:u.alarmOverride||{}};
      listenApp(); listenMe(ref);
    }else{ CLOUD.role=null; CLOUD.phone=null; adminLoggedIn=false; DB.currentUser=null; }
  }catch(e){
    CLOUD.role=null; DB.currentUser=null; adminLoggedIn=false; CLOUD.ready=true;
    try{ await fAuth.signOut(); }catch(_){} refreshAll(); alert(authMsg(e)); return;
  }
  CLOUD.ready=true; refreshAll(); if(CLOUD.role==='user') scheduleNotifications();
}

function secApp(){ return firebase.apps.find(a=>a.name==='sec')||firebase.initializeApp(FB_CFG,'sec'); }
async function createAuth(phone,v,pw){ const s=secApp().auth(); const c=await s.createUserWithEmailAndPassword(authEmail(phone,v),pw); await s.signOut(); return c.user.uid; }
async function addUser(name,phone){
  if(!/^\d{8,15}$/.test(phone)) throw {msg:'সঠিক ফোন নম্বর দিন (country code সহ, শুধু ডিজিট)।'};

  const uid=await createAuth(phone,1,userPw(phone)), b=fDb.batch();
  b.set(fDb.doc('uidmap/'+uid),{phone}); b.set(fDb.doc('loginIndex/'+phone),{v:1});
  b.set(fDb.doc('users/'+phone),{phone,name,uid,active:true,deviceId:null,prefs:{},alarmOverride:{},createdAt:Date.now()});
  await b.commit();
}
// change phone and/or password (new Auth account, old one is cut off)
async function rotateUser(oldPhone,newPhone){
  if(!/^\d{8,15}$/.test(newPhone)) throw {msg:'সঠিক ফোন নম্বর দিন।'};
  if(newPhone!==oldPhone && (await fDb.doc('loginIndex/'+newPhone).get()).exists) throw {msg:'নতুন নম্বর আগেই রেজিস্টার্ড।'};
  const old=(await fDb.doc('users/'+oldPhone).get()).data(), v=((await fDb.doc('loginIndex/'+oldPhone).get()).data().v||1)+1;
  const uid=await createAuth(newPhone,v,userPw(newPhone)), b=fDb.batch();
  b.delete(fDb.doc('uidmap/'+old.uid)); b.set(fDb.doc('uidmap/'+uid),{phone:newPhone});
  if(newPhone!==oldPhone){ b.delete(fDb.doc('users/'+oldPhone)); b.delete(fDb.doc('loginIndex/'+oldPhone)); }
  b.set(fDb.doc('loginIndex/'+newPhone),{v}); b.set(fDb.doc('users/'+newPhone),Object.assign({},old,{phone:newPhone,uid,deviceId:null}));
  await b.commit();
}
async function deleteUser(phone){
  const u=(await fDb.doc('users/'+phone).get()).data(), b=fDb.batch();
  if(u&&u.uid) b.delete(fDb.doc('uidmap/'+u.uid));
  b.delete(fDb.doc('users/'+phone)); b.delete(fDb.doc('loginIndex/'+phone)); await b.commit();
}
